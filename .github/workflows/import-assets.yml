name: Import site files from giampieroriggio.com (one-time)

on:
  push:
    paths: ['.github/workflows/import-assets.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          BASE=https://giampieroriggio.com/tramontana
          for f in assets/plus_w.png assets/tramontana_glow.png assets/tramontana_gradient.jpg \
                   assets/tramontana_portrait.webp assets/tramontana_reel.mp4 fonts/tramontanasans.woff2; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 -o "$f" "$BASE/$f"
            echo "$f  $(du -h "$f" | cut -f1)  $(file -b --mime-type "$f")"
          done
      - name: Commit files and remove this one-time workflow
        run: |
          git rm -q .github/workflows/import-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets fonts
          git commit -m "Import images, video and font from giampieroriggio.com/tramontana"
          git push
