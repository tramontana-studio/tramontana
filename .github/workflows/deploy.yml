name: Deploy to giampieroriggio.com/tramontana

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 2
            open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST
            mirror -R --verbose -x '^\.git' -x '^README\.md$' ./ $SFTP_DIR
          "
